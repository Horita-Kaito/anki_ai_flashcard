name: Deploy Staging

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PASSPORT_PRIVATE_KEY_B64: ${{ secrets.PASSPORT_PRIVATE_KEY_B64 }}
          PASSPORT_PUBLIC_KEY_B64: ${{ secrets.PASSPORT_PUBLIC_KEY_B64 }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          envs: PASSPORT_PRIVATE_KEY_B64,PASSPORT_PUBLIC_KEY_B64
          script: |
            set -e
            APP_ROOT="$HOME/srv/apps/anki-ai-flashcard"
            REPO_DIR="${APP_ROOT}/repo"
            COMPOSE_FILE="${REPO_DIR}/docker-compose.staging.yml"
            # 同サーバの他プロジェクト (yutaka-admin 等) と project 名が衝突して
            # コンテナを上書きされる事故を防ぐため、project 名は anki で固定する。
            COMPOSE_PROJECT=anki

            cd "$REPO_DIR"

            # 最新コード取得
            git fetch origin develop
            git reset --hard origin/develop

            # .env symlink (data/.env を compose の変数展開用に)
            ln -sf ../data/.env .env

            # Passport 鍵 (MCP OAuth 用) を GitHub Secrets から data/.env に注入する。
            # env_file は改行を扱えないため単一行 base64 で渡し、
            # config/passport.php 側で base64_decode して読む。
            if [ -n "$PASSPORT_PRIVATE_KEY_B64" ]; then
              sed -i '/^PASSPORT_PRIVATE_KEY_B64=/d;/^PASSPORT_PUBLIC_KEY_B64=/d' "${APP_ROOT}/data/.env"
              {
                printf 'PASSPORT_PRIVATE_KEY_B64=%s\n' "$PASSPORT_PRIVATE_KEY_B64"
                printf 'PASSPORT_PUBLIC_KEY_B64=%s\n' "$PASSPORT_PUBLIC_KEY_B64"
              } >> "${APP_ROOT}/data/.env"
            fi

            # ghcr.io ログイン & イメージ pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" pull

            # 起動 (--force-recreate で古いイメージのコンテナを確実に入れ替え)
            # backend image は Dockerfile.prod でビルドされ vendor/ も baked-in 済みのため
            # composer install ステップは不要。
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --remove-orphans --force-recreate

            # マイグレーション & キャッシュ
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" exec -T backend php artisan migrate --force

            # Passport 鍵チェック (MCP OAuth 用)。backend はコード焼き込みイメージで
            # storage が非永続のため、鍵は data/.env の PASSPORT_PRIVATE_KEY /
            # PASSPORT_PUBLIC_KEY で注入する必要がある。無ければ警告 (デプロイは継続)。
            if ! docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" exec -T backend sh -c '[ -n "$PASSPORT_PRIVATE_KEY" ] || [ -n "$PASSPORT_PRIVATE_KEY_B64" ] || [ -f storage/oauth-private.key ]'; then
              echo "WARNING: Passport keys が未設定のため MCP OAuth は動作しません。GitHub Secrets (staging) に PASSPORT_PRIVATE_KEY_B64 / PASSPORT_PUBLIC_KEY_B64 を設定してください。"
            fi

            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" exec -T backend php artisan config:cache
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" exec -T backend php artisan route:cache
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" exec -T backend php artisan view:cache

            echo "Deploy completed successfully"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Staging deployment failed"
