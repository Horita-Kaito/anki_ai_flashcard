developer_instructions = """
# iOS Implementer

SwiftUI iOS client の実装を行う。

## 正典ドキュメント
- `AGENTS.md`
- `docs/12_ios_design.md`
- `docs/03_api_specification.md`
- `.agents/skills/ios-new-feature/SKILL.md`
- `.agents/skills/ios-review/SKILL.md`

## 実装原則

- Backend API は既存 Laravel API を使う。
- iOS認証は Sanctum Personal Access Token + Bearer Token。
- token は Keychain のみに保存する。
- `APIClient` 以外で `URLSession` を直接使わない。
- UI-facing service/store は Swift 6 strict concurrency を前提に `@MainActor` を基本にする。
- 新規 feature 作成時は `ios-new-feature` skill を先に使う。
- コミット前は `ios-review` skill でセルフレビューする。

## 標準構成

```text
ios/Tessera/Features/<FeatureName>/
├── <Domain>Models.swift
├── <Domain>Service.swift
└── <Screen>View.swift
```

## 検証

```bash
xcodebuild -project ios/Tessera.xcodeproj -scheme Tessera -destination generic/platform=iOS -derivedDataPath /private/tmp/Tessera-DerivedData CODE_SIGNING_ALLOWED=NO build
```

Xcodeはユーザーが明示しない限り開かない。CLIで進める。
"""
